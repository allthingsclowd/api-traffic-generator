
# HAProxy Configuration with Updated API Headers and Responses (Aligned to OAS with Drift)
global
    log /dev/log local0
    # log /dev/log local1 notice  # Commented out or remove to resolve logger #1 error
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend http_frontend
    bind *:80
    mode http

    # Capture the original protocol
    http-request set-header X-Client-Protocol req_proto
    # Capture the Authorization header if present
    http-request set-header X-Client-Authorization %[req.hdr(Authorization)]

    # --- Favicon ---
    acl is_favicon path /favicon.ico
    http-request return status 200 content-type "image/png" file /usr/local/etc/haproxy/icons/favicon32tp.png if is_favicon
    http-response set-header Protocol "%[hdr(X-Client-Protocol)]"

    # --- Shadow API ---
    acl shadow_api path_beg /shadow-api
    http-response set-header X-Shadow-API "active"
    http-response set-header Protocol "%[hdr(X-Client-Protocol)]"
    http-response set-header Authorization "%[hdr(X-Client-Authorization)]"
    http-request return status 200 content-type "application/json" string '{"message":"Shadow API is operational but undocumented."}' if shadow_api

    # --- Zombie API ---
    acl zombie_api path_beg /zombie-api/v1
    http-response set-header X-Zombie-API "deprecated"
    http-response set-header Protocol "%[hdr(X-Client-Protocol)]"
    http-response set-header Authorization "%[hdr(X-Client-Authorization)]"
    http-request return status 200 content-type "application/json" string '{"message":"Zombie API is still active but deprecated."}' if zombie_api

    # --- Drifted Endpoint (not in OAS) ---
    acl path_eshop_beta_catalog path /eshop/catalog/products-beta
    # This will be handled by its own backend now

    # --- API Route ACLs ---
    acl path_hr_api path_beg /hr
    acl path_finance_api path_beg /finance
    acl path_products_api path_beg /products
    acl path_banking_api path_beg /banking
    acl path_eshop_api path_beg /eshop

    use_backend drifted_api_backend if path_eshop_beta_catalog # Added for drifted API
    use_backend hr_backend if path_hr_api
    use_backend finance_backend if path_finance_api
    use_backend products_backend if path_products_api
    use_backend banking_backend if path_banking_api
    use_backend eshop_backend if path_eshop_api

backend hr_backend
    mode http
    http-response set-header X-Role-Aware "true"
    http-response set-header Protocol "%[hdr(X-Client-Protocol)]"
    http-response set-header X-Request-ID "SIMULATED-HR-123"
    http-response set-header Authorization "%[hdr(X-Client-Authorization)]"
    http-request return status 200 content-type "application/json" string '{"message":"SIMULATED-HR-123 response","employees":[{"id":1,"name":"Eve","role":"HR"}]}'
    server dummy 127.0.0.1:1 check disabled # Dummy server

backend finance_backend
    mode http
    http-response set-header X-Sensitive "true"
    http-response set-header Protocol "%[hdr(X-Client-Protocol)]"
    http-response set-header X-Request-ID "SIMULATED-FIN-456"
    http-response set-header Authorization "%[hdr(X-Client-Authorization)]"
    http-request return status 200 content-type "application/json" string '{"message":"SIMULATED-FIN-456 response","transactions":[{"id":5001,"amount":105.25,"currency":"USD","legacy":true}]}'
    server dummy 127.0.0.1:1 check disabled # Dummy server

backend products_backend
    mode http
    http-response set-header X-Catalog-Version "v2"
    http-response set-header Protocol "%[hdr(X-Client-Protocol)]"
    http-response set-header X-Request-ID "SIMULATED-PROD-789"
    http-response set-header Authorization "%[hdr(X-Client-Authorization)]"
    http-request return status 200 content-type "application/json" string '{"message":"SIMULATED-PROD-789 response","products":[{"sku":"XYZ-001","name":"Widget A","price":29.95},{"sku":"DRIFT-999","name":"Hidden Product"}]}'
    server dummy 127.0.0.1:1 check disabled # Dummy server

backend banking_backend
    mode http
    http-response set-header Protocol "%[hdr(X-Client-Protocol)]"
    http-response set-header X-Request-ID "SIMULATED-BANK-001"
    http-response set-header X-Transaction-ID "STATIC-TXN-001"
    # We don't echo Authorization for banking as per your drift note
    http-request return status 202 content-type "application/json" string '{"status":"approved","reference":"TXN12345","auth":"bypassed"}'
    server dummy 127.0.0.1:1 check disabled # Dummy server

backend eshop_backend
    mode http
    http-response set-header Set-Cookie "sessionId=abc123; Secure; HttpOnly"
    http-response set-header Protocol "%[hdr(X-Client-Protocol)]"
    http-response set-header Authorization "%[hdr(X-Client-Authorization)]"
    http-response set-header X-Request-ID "SIMULATED-ESHOP-002"
    http-request return status 201 content-type "application/json" string '{"message":"SIMULATED-ESHOP-002 response","confirmation":"Order Confirmed","items":[{"id":101,"qty":1}],"expedited":true}'
    server dummy 127.0.0.1:1 check disabled # Dummy server

backend shadow_api_backend
    mode http
    http-response set-header X-Backend-Service "Shadow"
    http-response set-header Protocol "%[hdr(X-Client-Protocol)]"
    http-response set-header Authorization "%[hdr(X-Client-Authorization)]"
    http-request return status 200 content-type "application/json" string '{"message":"Shadow API is operational but undocumented."}'
    server dummy 127.0.0.1:1 check disabled # Dummy server

backend zombie_api_backend
    mode http
    http-response set-header X-Backend-Service "Zombie"
    http-response set-header Protocol "%[hdr(X-Client-Protocol)]"
    http-response set-header Authorization "%[hdr(X-Client-Authorization)]"
    http-request return status 200 content-type "application/json" string '{"message":"Zombie API is still active but deprecated."}'
    server dummy 127.0.0.1:1 check disabled # Dummy server

backend drifted_api_backend
    mode http
    http-response set-header X-Drifted-Version "2.0-unstable"
    http-response set-header Protocol "%[hdr(X-Client-Protocol)]"
    http-response set-header Authorization "%[hdr(X-Client-Authorization)]"
    http-request return status 200 content-type "application/json" string '{"message":"Drifted API Response: BETA-001","products":[{"sku":"BETA-001","name":"Preview Gadget"}]}'
    server dummy 127.0.0.1:1 check disabled # Dummy server
