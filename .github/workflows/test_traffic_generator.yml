name: Test Traffic Generator

on:
  push:
    branches: [ grazzer, fixHeaders ]
  workflow_dispatch: # Allows manual triggering

jobs:
  test_traffic_script:
    runs-on: ubuntu-latest
    # Services block removed for HAProxy; it will be managed manually.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare HAProxy configuration
        run: |
          # This directory will be mounted into the HAProxy container
          mkdir -p ${{ github.workspace }}/local_haproxy_config/icons
          # Copy the HAProxy configuration file from its specified location
          cp ${{ github.workspace }}/.github/haproxy_files/haproxy.cfg ${{ github.workspace }}/local_haproxy_config/haproxy.cfg
          # Copy the new favicon from its specified location
          cp ${{ github.workspace }}/.github/haproxy_files/icons/favicon32tp.png ${{ github.workspace }}/local_haproxy_config/icons/favicon32tp.png
        working-directory: ${{ github.workspace }}

      - name: Start HAProxy container
        run: |
          docker run -d --name haproxy-test \
            --user root \
            -v ${{ github.workspace }}/local_haproxy_config:/usr/local/etc/haproxy:ro \
            -p 80:80 \
            haproxy:latest

      - name: Wait for HAProxy to be ready
        run: |
          echo "Waiting for HAProxy to be ready..."
          for i in {1..30}; do # Wait up to 30 seconds (adjust as needed)
            # Check if HAProxy is responding on the favicon path (or any other simple health check path)
            if curl -sf http://localhost:80/favicon.ico > /dev/null; then
              echo "HAProxy is ready."
              docker logs haproxy-test # Optional: display HAProxy logs on success for debugging
              exit 0
            fi
            echo -n "."
            sleep 1
          done
          echo "HAProxy did not become ready in time."
          docker logs haproxy-test # Display HAProxy logs on failure
          exit 1

      - name: Run the traffic generator script
        run: |
          chmod +x api_tester.sh
          echo "Current working directory: $(pwd)"
          echo "Workspace location: ${{ github.workspace }}"
          echo "Listing workspace contents before script run:"
          ls -la ${{ github.workspace }}
          # HAProxy is accessible on localhost:80 due to port mapping in `docker run`.
          # Capture script output for debugging and save to a file in the workspace.
          # Use 'set -o pipefail' to ensure the step fails if any command in the pipe fails.
          set -o pipefail
          echo "Attempting to run api_tester.sh and tee output to ${{ github.workspace }}/api_tester_console_output.log"
          ./api_tester.sh http://localhost:80 2>&1 | tee "${{ github.workspace }}/api_tester_console_output.log"
          echo "Script execution pipeline finished. Exit code of pipeline: $?"
          echo "Listing workspace contents after script run:"
          ls -la ${{ github.workspace }}
        working-directory: ${{ github.workspace }}

      - name: List /tmp contents after script run
        run: |
          echo "Listing contents of /tmp after script execution:"
          ls -la /tmp
      - name: Verify script execution (implicit)
        run: |
          echo "api_tester.sh completed. If it had failed, the workflow would have stopped due to 'set -e' in the script or a non-zero exit code."

      - name: Find and prepare log file
        id: find_log
        run: |
          log_file_path=$(ls -t /tmp/api_tester_*.log | head -n 1)
          if [ -z "$log_file_path" ]; then
            echo "Log file not found in /tmp with pattern api_tester_*.log!" >&2
            # List /tmp content for debugging
            ls -la /tmp
            exit 1
          fi
          echo "Found log file: $log_file_path"
          # Copy log to workspace for potential artifact upload and easier access in logs
          cp "$log_file_path" "${{ github.workspace }}/api_tester_output.log"
          echo "log_file_path=${{ github.workspace }}/api_tester_output.log" >> $GITHUB_OUTPUT
        shell: bash

      - name: Check log file content
        run: |
          log_file="${{ steps.find_log.outputs.log_file_path }}"
          echo "Checking log file: $log_file"

          if [ ! -s "$log_file" ]; then
            echo "Log file is empty or does not exist at the expected workspace path!" >&2
            exit 1
          fi
          echo "Log file exists in workspace and is not empty."

          patterns=(
            "SIMULATED-HR-123"
            "SIMULATED-FIN-456"
            "SIMULATED-PROD-789"
            "TXN12345" # From banking_backend in haproxy.cfg
            "SIMULATED-ESHOP-002"
            "Shadow API is operational" # From shadow_api acl in haproxy.cfg
            "Zombie API is still active" # From zombie_api acl in haproxy.cfg
            "Drifted API Response: BETA-001" # Specific check for drifted endpoint
          )
          
          missing_patterns=0
          for pattern in "${patterns[@]}"; do
            if ! grep -q "$pattern" "$log_file"; then
              echo "Pattern '$pattern' not found in log file!" >&2
              missing_patterns=$((missing_patterns + 1))
            else
              echo "Pattern '$pattern' found."
            fi
          done

          if [ "$missing_patterns" -gt 0 ]; then
            echo "$missing_patterns pattern(s) missing. Failing the test." >&2
            echo "--- Full log content ($log_file) ---"
            cat "$log_file"
            echo "--- End of log ---"
            exit 1
          fi
          
          echo "All expected patterns found in log file."
        shell: bash

      - name: Upload HAProxy and Traffic Generator Logs
        if: always() # Run this step even if previous steps fail
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            ${{ github.workspace }}/api_tester_console_output.log # Upload console output
            ${{ github.workspace }}/api_tester_output.log
            # Note: Accessing HAProxy logs from a service container is not as direct as 'docker logs'.
            # For manually started containers, use 'docker logs <container_name>'
            # We can capture them to a file if needed before cleanup, or rely on the output from the "Wait for HAProxy" step.
          retention-days: 7
      - name: Stop and remove HAProxy container
        if: always() # Ensure cleanup even if previous steps fail
        run: |
          docker stop haproxy-test || true # Allow to fail if already stopped
          docker rm haproxy-test || true   # Allow to fail if already removed
